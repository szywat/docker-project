services:
  postgres:
    image: postgres:18-alpine
    container_name: project_db
    environment:
      - POSTGRES_DB={POSTGRES_DB}
      - POSTGRES_USER={POSTGRES_USER}
      - POSTGRES_PASSWORD={POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    networks:
      - project_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: project_redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - project_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_backend
    environment:
      - DB_HOST={POSTGRES_HOST}
      - DB_PORT={POSTGRES_PORT}
      - DB_NAME={POSTGRES_DB}
      - DB_USER={POSTGRES_USER}
      - DB_PASSWORD={POSTGRES_PASSWORD}
      - PORT={BACKEND_PORT}
      - REDIS_URL={REDIS_URL}
    networks:
      - project_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -X GET http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: project_frontend
    ports:
      - 3000:3000
    networks:
      - project_network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  project_network:
    driver: bridge
